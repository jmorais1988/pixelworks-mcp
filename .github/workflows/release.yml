# Builds a distributable zip and attaches it to a GitHub Release whenever a
# version tag (v1.2.3) is pushed. Users who don't want to clone can download
# pixelworks-mcp-<version>.zip from the Releases page.
#
# Cut a release:
#   1. bump  version = "x.y.z"  in pyproject.toml and commit
#   2. git tag vx.y.z && git push origin vx.y.z
# The tag must match pyproject.toml or the job fails (guards against
# mismatched zips). Tags containing "-" (v1.1.0-rc1) are marked pre-release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version and check it matches pyproject.toml
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$TAG" != "$PY" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $PY"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Syntax-check shipped Python
        run: python3 -m py_compile server.py reapply_headless_patch.py krita-plugin/kritamcp/actions_v2.py tests/*.py

      - name: Build zip
        run: |
          NAME="pixelworks-mcp-${{ steps.meta.outputs.version }}"
          mkdir -p "dist/$NAME"
          # Ship exactly what the README's "Repository layout" lists.
          cp -r server.py reapply_headless_patch.py requirements.txt pyproject.toml \
                presets.example.json README.md DEVELOPMENT.md LICENSE \
                krita-plugin tests examples "dist/$NAME/"
          find "dist/$NAME" -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd dist && zip -rq "$NAME.zip" "$NAME")
          (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          ls -l dist
          unzip -l "dist/$NAME.zip" | tail -n 1

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: pixelworks-mcp ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/pixelworks-mcp-${{ steps.meta.outputs.version }}.zip
            dist/pixelworks-mcp-${{ steps.meta.outputs.version }}.zip.sha256
